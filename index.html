<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黄ばみチェッカー</title>
    <style>
        body { margin: 0; background-color: #f5f5f5; font-family: sans-serif; text-align: center; }
        
        #home-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        h1 { color: #333; }
        .btn { background-color: #007AFF; color: white; border: none; padding: 20px 40px; font-size: 20px; border-radius: 10px; margin: 10px; width: 80%; max-width: 300px; font-weight: bold; }

        #camera-screen { display: none; position: relative; height: 100vh; height: 100dvh; background-color: black; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #target-circle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; border: 3px solid #00FF00; border-radius: 50%;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #guide-text { 
            position: absolute; top: 10%; left: 0; width: 100%; color: white; font-size: 20px; font-weight: bold; text-shadow: 1px 1px 3px black; white-space: pre-wrap; 
            z-index: 10; padding: 0 10px; box-sizing: border-box;
        }
        
        #capture-btn { 
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); 
            background-color: white; color: black; border: none; padding: 15px 30px; 
            font-size: 18px; border-radius: 30px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            z-index: 10; width: 80%; max-width: 300px;
        }

        .rank-result { font-size: 32px; color: #FFD700; text-shadow: 2px 2px 4px #000; margin-top: 5px; display: inline-block; }
        .diff-value { font-size: 16px; color: #ddd; margin-top: 10px; display: block; font-weight: normal; }
    </style>
</head>
<body>

    <div id="home-screen">
        <h1>何をチェックしますか？</h1>
        <button class="btn" onclick="startCamera('黄ばみ')">衣類の黄ばみ</button>
        <button class="btn" onclick="startCamera('シミ')">衣類のシミ</button>
    </div>

    <div id="camera-screen">
        <video id="video" autoplay playsinline></video>
        <div id="target-circle"></div>
        <div id="guide-text">まずは真っ白な紙を<br>円に合わせてください</div>
        <button id="capture-btn">基準の白を記憶する</button>
    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const cameraScreen = document.getElementById('camera-screen');
        const video = document.getElementById('video');
        const guideText = document.getElementById('guide-text');
        const captureBtn = document.getElementById('capture-btn');

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        let step = 1;
        let baseLab = null;

        async function startCamera(mode) {
            homeScreen.style.display = 'none';
            cameraScreen.style.display = 'block';
            step = 1;
            guideText.innerHTML = "まずは真っ白な紙を<br>円に合わせてください";
            captureBtn.innerText = "基準の白を記憶する";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert('カメラの起動に失敗しました。');
                homeScreen.style.display = 'flex';
                cameraScreen.style.display = 'none';
            }
        }

        function rgbToLab(r, g, b) {
            let r_ = r / 255, g_ = g / 255, b_ = b / 255;
            r_ = (r_ > 0.04045) ? Math.pow((r_ + 0.055) / 1.055, 2.4) : r_ / 12.92;
            g_ = (g_ > 0.04045) ? Math.pow((g_ + 0.055) / 1.055, 2.4) : g_ / 12.92;
            b_ = (b_ > 0.04045) ? Math.pow((b_ + 0.055) / 1.055, 2.4) : b_ / 12.92;
            let x = (r_ * 0.4124 + g_ * 0.3576 + b_ * 0.1805) * 100;
            let y = (r_ * 0.2126 + g_ * 0.7152 + b_ * 0.0722) * 100;
            let z = (r_ * 0.0193 + g_ * 0.1192 + b_ * 0.9505) * 100;
            x = x / 95.047; y = y / 100.000; z = z / 108.883;
            x = (x > 0.008856) ? Math.pow(x, 1/3) : (7.787 * x) + 16/116;
            y = (y > 0.008856) ? Math.pow(y, 1/3) : (7.787 * y) + 16/116;
            z = (z > 0.008856) ? Math.pow(z, 1/3) : (7.787 * z) + 16/116;
            return { L: (116 * y) - 16, a: 500 * (x - y), b: 200 * (y - z) };
        }

        captureBtn.onclick = () => {
            if (step === 3) {
                startCamera('黄ばみ');
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const pixel = ctx.getImageData(centerX, centerY, 1, 1).data;
            const currentLab = rgbToLab(pixel[0], pixel[1], pixel[2]);

            if (step === 1) {
                baseLab = currentLab;
                guideText.innerText = `基準色を記憶しました！\n次に判定したい衣類を\n円に合わせてください`;
                captureBtn.innerText = "衣類を判定する";
                step = 2;

            } else if (step === 2) {
                const diffB = currentLab.b - baseLab.b;
                
                let rank = "";
                if (diffB <= 1) {
                    rank = "新古品";
                } else if (diffB <= 2) {
                    rank = "未使用に近い";
                } else if (diffB <= 5) {
                    rank = "目立った傷や汚れなし";
                } else if (diffB <= 8) {
                    rank = "やや傷や汚れあり";
                } else if (diffB <= 10) {
                    rank = "傷や汚れあり";
                } else {
                    rank = "全体的に状態が悪い";
                }

                // ▼ 変更点：ランクと一緒に diffB の数値を画面に表示する ▼
                guideText.innerHTML = `判定結果<br><span class="rank-result">${rank}</span><br><span class="diff-value">(黄ばみ数値: ${diffB.toFixed(1)})</span>`;
                captureBtn.innerText = "もう一度やり直す";
                step = 3;
            }
        };
    </script>
</body>
</html>
